[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rdna3-fastmm"
version = "0.1.0"
description = "Experimental reduced-multiplication BF16 and FP16 Linear kernels for AMD RDNA3"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Andrey Vlasenko"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
runtime = ["torch>=2.9,<2.10", "triton>=3.5,<3.6"]
dev = ["mypy>=1.18", "pytest>=8.4", "ruff>=0.12"]

[project.urls]
Repository = "https://github.com/chelokot/rdna3-fastmm"

[project.entry-points."torch_dynamo_backends"]
rdna3-fastmm = "rdna3_fastmm.inductor:compile_backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/test_rdna3.py" = ["E402"]
"tests/test_inductor.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "^(src/rdna3_fastmm/generated/|tests/test_(rdna3|inductor).py$)"
